[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-radar"
version = "0.1.0"
description = "Weekly LLM inference research radar"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
radar = "radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
